<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RoadIQ Voice — Nova Sonic prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body {
    background: #1c1c1e; color: #fff; font-family: 'Inter', -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 24px;
    min-height: 100vh; margin: 0;
  }
  h1 { color: #DC1730; font-size: 20px; margin-bottom: 4px; }
  .sub { color: #999; font-size: 13px; margin-bottom: 24px; }
  #mic-btn {
    width: 96px; height: 96px; border-radius: 50%; border: none;
    background: #DC1730; color: #fff; font-size: 32px; cursor: pointer;
    box-shadow: 0 0 0 0 rgba(220,23,48,0.5); transition: box-shadow 0.3s;
  }
  #mic-btn.listening { animation: pulse 1.5s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(220,23,48,0.5); }
    70% { box-shadow: 0 0 0 20px rgba(220,23,48,0); }
    100% { box-shadow: 0 0 0 0 rgba(220,23,48,0); }
  }
  #status { margin-top: 16px; font-size: 14px; color: #aaa; }
  #transcript {
    width: 100%; max-width: 480px; margin-top: 24px; display: flex;
    flex-direction: column; gap: 8px; max-height: 50vh; overflow-y: auto;
  }
  .bubble { padding: 10px 14px; border-radius: 12px; font-size: 14px; max-width: 85%; }
  .bubble.user { background: #DC1730; align-self: flex-end; }
  .bubble.assistant { background: #2c2c2e; border-left: 3px solid #DC1730; align-self: flex-start; }
  .bubble.tool { background: #14261a; border-left: 3px solid #30d158; align-self: flex-start; font-family: monospace; font-size: 12px; color: #9fdcb0; }
  a.back { color: #DC1730; text-decoration: none; margin-bottom: 16px; font-size: 13px; }
</style>
</head>
<body>
  <a class="back" href="/">&larr; Back to RoadIQ</a>
  <h1>🎙️ RoadIQ Voice (prototype)</h1>
  <div class="sub">Amazon Nova Sonic — hands-free stop, food &amp; parking questions</div>
  <button id="mic-btn">🎤</button>
  <div id="status">Tap to talk</div>
  <div id="transcript"></div>

  <script>
    const WS_URL = "ws://localhost:8765";
    const micBtn = document.getElementById("mic-btn");
    const statusEl = document.getElementById("status");
    const transcriptEl = document.getElementById("transcript");

    let ws = null;
    let audioCtx = null;
    let micStream = null;
    let micSourceNode = null;
    let workletNode = null;
    let listening = false;

    // Playback: queue of Float32 buffers, played back-to-back at 24kHz.
    let playCtx = null;
    let playHeadTime = 0;

    function addBubble(role, text) {
      const div = document.createElement("div");
      div.className = "bubble " + role;
      div.textContent = text;
      transcriptEl.appendChild(div);
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
    }

    function base64ToInt16(b64) {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return new Int16Array(bytes.buffer);
    }

    function int16ToBase64(int16arr) {
      const bytes = new Uint8Array(int16arr.buffer);
      let binary = "";
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary);
    }

    function playPcm16(int16arr, sampleRate) {
      if (!playCtx) {
        playCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate });
        playHeadTime = playCtx.currentTime;
      }
      const float32 = new Float32Array(int16arr.length);
      for (let i = 0; i < int16arr.length; i++) float32[i] = int16arr[i] / 32768;

      const buffer = playCtx.createBuffer(1, float32.length, sampleRate);
      buffer.copyToChannel(float32, 0);

      const source = playCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(playCtx.destination);

      const now = playCtx.currentTime;
      const startAt = Math.max(now, playHeadTime);
      source.start(startAt);
      playHeadTime = startAt + buffer.duration;
    }

    async function startListening() {
      ws = new WebSocket(WS_URL);
      ws.onopen = () => { statusEl.textContent = "Connecting to Nova Sonic..."; };
      ws.onmessage = async (evt) => {
        const msg = JSON.parse(evt.data);
        if (msg.type === "ready") {
          statusEl.textContent = "Listening... speak now";
          await beginMicCapture();
        } else if (msg.type === "audio") {
          const pcm = base64ToInt16(msg.data);
          playPcm16(pcm, 24000);
        } else if (msg.type === "transcript") {
          const role = (msg.role || "").toLowerCase() === "user" ? "user" : "assistant";
          addBubble(role, msg.text);
        } else if (msg.type === "tool_call") {
          addBubble("tool", `🔧 ${msg.tool}(${JSON.stringify(msg.args)}) -> ${JSON.stringify(msg.result)}`);
        } else if (msg.type === "barge_in") {
          playHeadTime = playCtx ? playCtx.currentTime : 0;
        }
      };
      ws.onerror = () => { statusEl.textContent = "Connection error — is voice_server.py running?"; };
      ws.onclose = () => { statusEl.textContent = "Disconnected"; stopListening(); };
    }

    async function beginMicCapture() {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1 } });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      await audioCtx.audioWorklet.addModule("/voice-worklet.js");

      micSourceNode = audioCtx.createMediaStreamSource(micStream);
      workletNode = new AudioWorkletNode(audioCtx, "mic-capture-processor", {
        processorOptions: { inputSampleRate: audioCtx.sampleRate },
      });
      workletNode.port.onmessage = (evt) => {
        if (!listening || !ws || ws.readyState !== WebSocket.OPEN) return;
        const int16 = new Int16Array(evt.data);
        ws.send(JSON.stringify({ type: "audio", data: int16ToBase64(int16) }));
      };
      micSourceNode.connect(workletNode);
      listening = true;
      micBtn.classList.add("listening");
      micBtn.textContent = "⏹️";
    }

    function stopListening() {
      listening = false;
      micBtn.classList.remove("listening");
      micBtn.textContent = "🎤";
      statusEl.textContent = "Tap to talk";
      if (micStream) micStream.getTracks().forEach((t) => t.stop());
      if (workletNode) workletNode.disconnect();
      if (micSourceNode) micSourceNode.disconnect();
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "stop" }));
        ws.close();
      }
      ws = null;
    }

    micBtn.addEventListener("click", () => {
      if (listening) {
        stopListening();
      } else {
        transcriptEl.innerHTML = "";
        startListening();
      }
    });
  </script>
</body>
</html>
