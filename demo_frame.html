<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoadIQ – Pilot Flying J Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, sans-serif;
  }

  /* ── Demo label ── */
  .demo-label {
    position: fixed;
    top: 18px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.35);
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 600;
    z-index: 10;
  }

  /* ── iPhone 15 Pro outer shell ── */
  .iphone {
    position: relative;
    width: 393px;
    height: 852px;
    background: #1c1c1e;
    border-radius: 54px;
    box-shadow:
      /* titanium band */
      0 0 0 2px #4a4a4e,
      0 0 0 3px #8e8e93,
      0 0 0 5px #3a3a3c,
      /* outer shadow */
      0 40px 100px rgba(0,0,0,0.85),
      0 10px 30px rgba(0,0,0,0.5);
    overflow: hidden;
    flex-shrink: 0;
  }

  /* Screen glass */
  .iphone-screen {
    position: absolute;
    inset: 0;
    border-radius: 52px;
    overflow: hidden;
    background: #000;
  }

  /* iframe fills the screen */
  .iphone-screen iframe {
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 52px;
    /* scale down Streamlit's padding */
    transform-origin: top left;
  }

  /* Dynamic island */
  .dynamic-island {
    position: absolute;
    top: 13px;
    left: 50%;
    transform: translateX(-50%);
    width: 126px;
    height: 37px;
    background: #000;
    border-radius: 20px;
    z-index: 100;
    /* subtle inner glow */
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.08);
  }

  /* Side buttons */
  .btn-power {
    position: absolute;
    right: -4px;
    top: 160px;
    width: 4px;
    height: 80px;
    background: #5a5a5e;
    border-radius: 0 3px 3px 0;
  }
  .btn-vol-up {
    position: absolute;
    left: -4px;
    top: 130px;
    width: 4px;
    height: 50px;
    background: #5a5a5e;
    border-radius: 3px 0 0 3px;
  }
  .btn-vol-dn {
    position: absolute;
    left: -4px;
    top: 195px;
    width: 4px;
    height: 50px;
    background: #5a5a5e;
    border-radius: 3px 0 0 3px;
  }
  .btn-mute {
    position: absolute;
    left: -4px;
    top: 100px;
    width: 4px;
    height: 32px;
    background: #5a5a5e;
    border-radius: 3px 0 0 3px;
  }

  /* Screen glare overlay */
  .iphone-screen::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg,
      rgba(255,255,255,0.04) 0%,
      transparent 40%,
      transparent 100%);
    border-radius: 52px;
    pointer-events: none;
    z-index: 200;
  }

  /* ── Hack: hide Streamlit chrome that leaks through ── */
  .iphone-screen iframe {
    /* bump up the frame so Streamlit's top toolbar is off-screen */
    margin-top: -56px;
    height: calc(100% + 56px);
  }
</style>
</head>
<body>

<div class="demo-label">RoadIQ · Innovate 2026 · Pilot Flying J</div>

<div class="iphone">
  <div class="iphone-screen">
    <iframe
      src="http://localhost:8501"
      title="RoadIQ App"
      scrolling="yes"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope"
    ></iframe>
  </div>
  <div class="dynamic-island"></div>
  <div class="btn-power"></div>
  <div class="btn-mute"></div>
  <div class="btn-vol-up"></div>
  <div class="btn-vol-dn"></div>
</div>

</body>
</html>
